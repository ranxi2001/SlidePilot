<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlidePilot</title>
  <link rel="stylesheet" href="/public/css/app.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1>SlidePilot</h1>
        <p class="tagline">把想法变成可预览、可导出的演示文稿</p>
      </div>
      <div id="status-pill" class="status-pill">未连接</div>
    </header>

    <main class="workspace">
      <section class="input-panel">
        <label for="prompt">演示需求</label>
        <textarea id="prompt" rows="5" placeholder="例如：帮我做一份 8 页中文演示文稿，主题是 AI Agent 如何改造企业流程自动化，面向 SaaS 管理层，风格科技专业。"></textarea>

        <div class="options">
          <label>
            风格
            <select id="style">
              <option value="tech-dark">科技深色</option>
              <option value="modern-light">现代明亮</option>
              <option value="minimal">极简</option>
            </select>
          </label>
          <label>
            页数
            <input id="pages" type="number" value="8" min="4" max="20">
          </label>
        </div>

        <button id="btn-create">生成演示文稿</button>
      </section>

      <div class="output-column">
        <section id="agent-panel" class="agent-panel" hidden>
          <div class="panel-header">
            <div>
              <h2>Agent 运行过程</h2>
              <p id="agent-summary">等待开始</p>
            </div>
            <div class="run-stats">
              <span id="stat-elapsed">0.0s</span>
              <span id="stat-events">0 events</span>
            </div>
          </div>

          <div class="stage-grid" id="stage-grid"></div>

          <div class="event-toolbar">
            <span>实时事件</span>
            <label><input id="filter-llm" type="checkbox" checked> LLM</label>
            <label><input id="filter-tool" type="checkbox" checked> 工具</label>
            <label><input id="filter-artifact" type="checkbox" checked> 产物</label>
            <label><input id="filter-qa" type="checkbox" checked> QA</label>
          </div>
          <ol id="event-list" class="event-list"></ol>
        </section>

        <section id="preview-panel" class="preview-panel" hidden>
          <div class="panel-header">
            <div>
              <h2>生成结果</h2>
              <p id="result-summary">预览已就绪</p>
            </div>
            <div class="actions">
              <a id="btn-pptx" class="btn" download hidden>下载 PPTX</a>
              <a id="btn-pdf" class="btn" download hidden>下载 PDF</a>
              <a id="btn-html" class="btn" download>下载 HTML</a>
            </div>
          </div>
          <div class="revision-panel">
            <label>
              修订页
              <input id="revision-page" type="number" min="1" value="1">
            </label>
            <label class="revision-instruction">
              修改指令
              <textarea id="revision-instruction" rows="2" placeholder="例如：把第 2 页改成三栏对比，并减少文字密度"></textarea>
            </label>
            <button id="btn-revise" type="button">修订此页</button>
          </div>
          <iframe id="preview-frame" title="Slide preview"></iframe>
          <div id="quality-panel" class="quality-panel" hidden>
            <div class="quality-section">
              <div class="quality-header">
                <h3>QA 检查</h3>
                <span id="qa-summary">等待结果</span>
              </div>
              <ul id="qa-list" class="qa-list"></ul>
            </div>
            <div class="quality-section">
              <div class="quality-header">
                <h3>截图</h3>
                <span id="screenshot-summary">0 张</span>
              </div>
              <div id="screenshot-gallery" class="screenshot-gallery"></div>
            </div>
            <div class="quality-section">
              <div class="quality-header">
                <h3>图片资产</h3>
                <span id="asset-summary">0 个</span>
              </div>
              <div id="asset-gallery" class="screenshot-gallery"></div>
            </div>
            <div class="quality-section">
              <div class="quality-header">
                <h3>修订历史</h3>
                <span id="revision-summary">0 次</span>
              </div>
              <ol id="revision-history" class="revision-history"></ol>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="/public/js/app.js"></script>
</body>
</html>
